name: release

# Tag-driven. A tag such as v1.2.0 produces a Linux tarball and a Windows zip,
# publishes them as release assets, and mirrors the entry into Hyperion so the
# in-app updater has a channel to read.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.2.0
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev xz-utils

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package the bundle
        run: |
          set -euo pipefail
          version="${{ inputs.tag }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME}"; fi
          staging="prjct_rpck-linux-x64"
          rm -rf "$staging"
          cp -r build/linux/x64/release/bundle "$staging"
          cp README.md LICENSE "$staging"/ 2>/dev/null || true
          tar -czf "prjct_rpck-${version}-linux-x64.tar.gz" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: prjct_rpck-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package the bundle
        shell: pwsh
        run: |
          $version = '${{ inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = $env:GITHUB_REF_NAME }
          $staging = 'prjct_rpck-windows-x64'
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          Copy-Item -Recurse 'build/windows/x64/runner/Release' $staging
          Copy-Item 'README.md' $staging
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' $staging }
          $zip = "prjct_rpck-$version-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "$staging/*" -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: prjct_rpck-*-windows-x64.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Work out the release identity
        id: identity
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build a release note
        run: |
          set -euo pipefail
          version='${{ steps.identity.outputs.version }}'
          {
            echo "## PRJCT RPCK $version"
            echo
            echo "Linux and Windows x64 bundles."
            echo
            echo "| Platform | Asset |"
            echo "| --- | --- |"
            echo "| Linux x64 | \`prjct_rpck-$version-linux-x64.tar.gz\` |"
            echo "| Windows x64 | \`prjct_rpck-$version-windows-x64.zip\` |"
            echo
            echo "Verify the download against the SHA-256 sums attached to this release."
          } > RELEASE_NOTES.md

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum */*.tar.gz */*.zip > ../SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          name: PRJCT RPCK ${{ steps.identity.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.zip
            SHA256SUMS.txt

      # The secret is checked inside the script rather than in an `if:`,
      # because `secrets` is not a valid expression in a step condition.
      - name: Mirror the release into Hyperion
        env:
          HYPERION_TOKEN: ${{ secrets.HYPERION_PUBLISH_TOKEN }}
          HYPERION_API_URL: ${{ vars.HYPERION_API_URL || 'https://hyperion.alibks.dev' }}
        run: |
          set -euo pipefail
          if [ -z "${HYPERION_TOKEN}" ]; then
            echo "No Hyperion token configured, skipping the mirror."
            exit 0
          fi
          python3 scripts/render_hyperion_release.py \
            --version '${{ steps.identity.outputs.version }}' \
            --assets artifacts > /tmp/hyperion-bodies.jsonl
          while IFS= read -r body; do
            curl --fail --silent --show-error \
              -X POST "${HYPERION_API_URL}/api/store/apps/prjct_rpck/releases" \
              -H "Authorization: Bearer ${HYPERION_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$body"
            echo
          done < /tmp/hyperion-bodies.jsonl